name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Release one version at a time; never interrupt a publication already in progress.
concurrency:
  group: ldforge-release
  cancel-in-progress: false

jobs:
  check:
    name: Verify, test and pack release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify release tag, versions and main ancestry
        run: node scripts/release.mjs verify-tag
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Pack tested release artifacts
        run: npm run release:pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release-${{ github.ref_name }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            coverage/
          retention-days: 7

  publish:
    name: Publish tested packages to npm
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release-${{ github.ref_name }}
          path: release-artifacts/
      - run: node scripts/release.mjs verify-tag
      - name: Publish exact tested tarballs in dependency order
        run: node scripts/release.mjs publish
        env:
          # Optional first-release bootstrap; omit after configuring OIDC on all packages.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            RELEASE_BASE="${RELEASE_TAG%%+*}"
            if [[ "$RELEASE_BASE" == *-* ]]; then
              gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG" --prerelease
            else
              gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
            fi
          fi
          gh release upload "$RELEASE_TAG" release-artifacts/*.tgz --clobber

  website:
    name: Deploy website after npm publication
    needs: publish
    if: vars.WEBSITE_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/website.yml
    with:
      source_ref: ${{ github.sha }}
    secrets:
      WEBSITE_GITOPS_SSH_KEY: ${{ secrets.WEBSITE_GITOPS_SSH_KEY }}
