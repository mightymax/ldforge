name: Release

on:
  push:
    tags:
      - 'release-*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing batch tag to fully retest and publish without moving tags
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: read

# Release one batch at a time; never interrupt a publication already in progress.
concurrency:
  group: ldforge-release
  cancel-in-progress: false

jobs:
  check:
    name: Verify, test and pack release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - name: Verify release tag, versions and main ancestry
        run: node scripts/release.mjs verify-tag "$RELEASE_TAG"
      - name: Record verified source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Normalize historical generated metadata for checks
        if: github.event_name == 'workflow_dispatch'
        run: |
          cp ".releases/$RELEASE_TAG.json" "$RUNNER_TEMP/original-release-record.json"
          npx prettier --write ".releases/$RELEASE_TAG.json"
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Restore exact tagged metadata before packing
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          if [[ -f "$RUNNER_TEMP/original-release-record.json" ]]; then
            cp "$RUNNER_TEMP/original-release-record.json" ".releases/$RELEASE_TAG.json"
          fi
      - name: Pack tested release artifacts
        run: npm run release:pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release-${{ inputs.release_tag || github.ref_name }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            coverage/
          retention-days: 7

  publish:
    # Keep checks/artifacts available when an initial recovery publication is needed.
    if: vars.NPM_RELEASE_VIA_RETRY != 'true'
    name: Publish tested packages to npm
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release-${{ inputs.release_tag || github.ref_name }}
          path: release-artifacts/
      - run: npm ci --ignore-scripts
      - run: node scripts/release.mjs verify-tag "$RELEASE_TAG"
      - name: Publish exact tested tarballs in dependency order
        run: node scripts/release.mjs publish
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # JavaScript evaluates process.env; shell expansion is intentionally disabled.
            # shellcheck disable=SC2016
            PRERELEASE=$(node --input-type=module -e 'import fs from "node:fs"; console.log(JSON.parse(fs.readFileSync(`.releases/${process.env.RELEASE_TAG}.json`)).prerelease)')
            if [[ "$PRERELEASE" == true ]]; then
              gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG" --prerelease
            else
              gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
            fi
          fi
          gh release upload "$RELEASE_TAG" release-artifacts/*.tgz --clobber

  website:
    name: Deploy website after npm publication
    needs: [check, publish]
    if: vars.WEBSITE_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/website.yml
    with:
      source_ref: ${{ needs.check.outputs.source_sha }}
    secrets:
      WEBSITE_GITOPS_SSH_KEY: ${{ secrets.WEBSITE_GITOPS_SSH_KEY }}
