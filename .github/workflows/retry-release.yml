name: Retry tested npm release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing batch tag or historical vVERSION tag to recover
        required: true
        type: string
      artifact_run_id:
        description: Release workflow run containing the successfully tested npm artifacts
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ldforge-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
      id-token: write
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@11
      - run: npm ci --prefix tooling --ignore-scripts
      - name: Verify original release passed its checks
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.artifact_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > original-run.json
          gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" --slurp > original-jobs.json
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { verifyTag } from './tooling/scripts/release.mjs';
          verifyTag('source', process.env.RELEASE_TAG, { allowLegacy: true });
          const run = JSON.parse(readFileSync('original-run.json', 'utf8'));
          const pages = JSON.parse(readFileSync('original-jobs.json', 'utf8'));
          const sha = execFileSync('git', ['-C', 'source', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (run.path !== '.github/workflows/release.yml' || run.event !== 'push' || run.head_sha !== sha ||
              !pages.flatMap(page => page.jobs).some(job => job.name === 'Verify, test and pack release' && job.conclusion === 'success')) {
            throw new Error('Expected successfully tested artifacts from the original release workflow and exact tag commit.');
          }
          console.log(`Verified original release source ${sha}`);
          JS
          echo "sha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release-${{ inputs.release_tag }}
          path: source/release-artifacts
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Publish original tested tarballs using current recovery tooling
        run: |
          node --input-type=module <<'JS'
          import { resolve } from 'node:path';
          import { publishRelease } from './tooling/scripts/release.mjs';
          await publishRelease(resolve('source'));
          JS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            PRERELEASE=$(node --input-type=module -e 'import fs from "node:fs"; const p = `source/.releases/${process.env.RELEASE_TAG}.json`; console.log(fs.existsSync(p) ? JSON.parse(fs.readFileSync(p)).prerelease : /-/.test(process.env.RELEASE_TAG.split("+")[0]))')
            if [[ "$PRERELEASE" == true ]]; then
              gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG" --prerelease
            else
              gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
            fi
          fi
          gh release upload "$RELEASE_TAG" source/release-artifacts/*.tgz --clobber

  website:
    needs: publish
    if: vars.WEBSITE_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/website.yml
    with:
      source_ref: ${{ needs.publish.outputs.source_sha }}
    secrets:
      WEBSITE_GITOPS_SSH_KEY: ${{ secrets.WEBSITE_GITOPS_SSH_KEY }}
