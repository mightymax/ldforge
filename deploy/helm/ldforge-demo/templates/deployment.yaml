apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ldforge-demo.name" . }}
  labels:
    {{- include "ldforge-demo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ldforge-demo
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      {{- with .Values.image.sourceRevision }}
      annotations:
        ldforge.org/source-revision: {{ . | quote }}
      {{- end }}
      labels:
        {{- include "ldforge-demo.labels" . | nindent 8 }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: site
          {{- if .Values.image.digest }}
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          {{- else }}
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          {{- if .Values.analytics.enabled }}
          env:
            - name: LDFORGE_ANALYTICS_SCRIPT_URL
              value: {{ required "analytics.scriptUrl is required when analytics is enabled" .Values.analytics.scriptUrl | quote }}
            - name: LDFORGE_ANALYTICS_WEBSITE_ID
              value: {{ required "analytics.websiteId is required when analytics is enabled" .Values.analytics.websiteId | quote }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 128Mi
